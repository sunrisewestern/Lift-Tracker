name: Build & Release APK

# Releases are published automatically:
#  - push to main that changes versionName in app/app/build.gradle.kts → builds, tags v<version>
#    and publishes the release (skipped when that tag already exists);
#  - pushing a v* tag yourself does the same for that tag.
# Release notes come from release-notes/<version>.md when present, else GitHub's generated notes.
# The Gradle project lives in app/ (modules: app = phone, wear = Wear OS watch).
on:
  push:
    branches:
      - main
    paths:
      - 'app/app/build.gradle.kts'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APKs to GitHub Release'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Sign Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HEALTHANALYZER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEALTHANALYZER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEALTHANALYZER_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release signing keystore from secret..."
            KEYSTORE_FILE="$HOME/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            cat << EOF >> ~/.gradle/gradle.properties
          HEALTHANALYZER_STORE_FILE=$KEYSTORE_FILE
          HEALTHANALYZER_STORE_PASSWORD=$STORE_PASSWORD
          HEALTHANALYZER_KEY_ALIAS=$KEY_ALIAS
          HEALTHANALYZER_KEY_PASSWORD=$KEY_PASSWORD
          EOF
            echo "Signing configuration written to ~/.gradle/gradle.properties"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; release build will be unsigned."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          mkdir -p ../build-artifacts
          PHONE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          WEAR_APK=$(find wear/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$PHONE_APK" ] || [ -z "$WEAR_APK" ]; then
            echo "::error::Could not find release APK outputs!"
            exit 1
          fi

          # Extract version from tag or gradle
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          fi

          # Decide whether to publish a GitHub release.
          PUBLISH=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PUBLISH=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.create_release }}" == "true" ]]; then
            PUBLISH=true
          elif [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
              echo "Tag v${VERSION} already exists; building without publishing."
            else
              echo "New version ${VERSION} on main; publishing release v${VERSION}."
              PUBLISH=true
            fi
          fi

          NOTES_FILE="release-notes/${VERSION}.md"
          if [ -f "../$NOTES_FILE" ]; then
            echo "notes_path=$NOTES_FILE" >> $GITHUB_OUTPUT
          fi
          echo "publish=$PUBLISH" >> $GITHUB_OUTPUT

          cp "$PHONE_APK" "../build-artifacts/LiftTracker-${VERSION}.apk"
          cp "$WEAR_APK" "../build-artifacts/LiftTracker-Wear-${VERSION}.apk"
          cd ../build-artifacts
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          ls -lh

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: LiftTracker-${{ steps.prepare.outputs.version }}-apk
          path: build-artifacts/*
          retention-days: 30

      - name: Publish to GitHub Release
        if: steps.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.prepare.outputs.version }}
          files: build-artifacts/*
          body_path: ${{ steps.prepare.outputs.notes_path }}
          generate_release_notes: ${{ steps.prepare.outputs.notes_path == '' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
